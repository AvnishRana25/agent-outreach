name: Scheduled Monitoring

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: monitoring-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    name: Reply Sync & Community Monitoring
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      OUTREACH_ENV: production
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
      ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      SKRAPP_API_KEY: ${{ secrets.SKRAPP_API_KEY }}
      SETTINGS_YAML: ${{ secrets.SETTINGS_YAML }}
      PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write configuration files from secrets if provided
        run: |
          if [ -n "$SETTINGS_YAML" ]; then
            echo "$SETTINGS_YAML" > config/settings.yaml
          fi
          if [ -n "$PROFILE_YAML" ]; then
            echo "$PROFILE_YAML" > config/profile.yaml
          fi

      - name: Initialize remote schema
        run: python -m outreach init

      - name: Pull dashboard approvals & actions
        run: python -m outreach dashboard-sync

      - name: Sync replies & triage inbox
        run: python -m outreach sync

      - name: Check community boards & Reddit for opportunities
        run: python -m outreach community

      - name: Push fresh dashboard snapshot
        run: python -m outreach dashboard-sync

      - name: Alert Telegram on failure
        if: failure()
        run: |
          python -c "
          from outreach import alerts
          alerts.send_alert('workflow_failure', '❌ Scheduled Monitoring run failed in GitHub Actions. Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}', cooldown_minutes=5)
          " || true
