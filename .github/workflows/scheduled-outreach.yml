name: Scheduled Outreach

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      sending_enabled:
        description: 'Enable real outbound sending (OUTREACH_SENDING_ENABLED)'
        type: boolean
        default: true
      dry_run:
        description: 'Safe dry-run mode (logs actions without sending)'
        type: boolean
        default: false
      max_sends:
        description: 'Maximum emails to send in this run'
        required: false
        default: '5'
      run_prospecting:
        description: 'Run prospect discovery and pipeline preparation'
        type: boolean
        default: false

concurrency:
  group: outreach-sending
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  outreach:
    name: Outreach Sending & Follow-ups
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      OUTREACH_ENV: production
      OUTREACH_SENDING_ENABLED: ${{ github.event.inputs.sending_enabled != '' && github.event.inputs.sending_enabled || 'true' }}
      OUTREACH_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
      ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      SKRAPP_API_KEY: ${{ secrets.SKRAPP_API_KEY }}
      SETTINGS_YAML: ${{ secrets.SETTINGS_YAML }}
      PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write configuration files from secrets if provided
        run: |
          if [ -n "$SETTINGS_YAML" ]; then
            echo "$SETTINGS_YAML" > config/settings.yaml
          fi
          if [ -n "$PROFILE_YAML" ]; then
            echo "$PROFILE_YAML" > config/profile.yaml
          fi

      - name: Pre-flight Health Doctor Check
        run: python -m outreach doctor

      - name: Initialize remote schema
        run: python -m outreach init

      - name: Pull dashboard approvals & actions
        run: python -m outreach dashboard-sync

      - name: Sync inbox (ensure fresh replies before sending)
        run: python -m outreach sync

      - name: Prospecting & sequence preparation (every 4 hours or on demand)
        run: |
          HOUR=$(date -u +%H)
          if [ $((10#$HOUR % 4)) -eq 0 ] || [ "${{ github.event.inputs.run_prospecting }}" = "true" ]; then
            echo "Draft room check & pipeline preparation..."
            python -m outreach prepare || echo "Prepare completed or skipped based on inbox limits"
          else
            echo "Skipping discovery this hour (runs every 4 hours or via manual trigger)"
          fi

      - name: Send approved outreach & due follow-ups
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          MAX_SENDS="${{ github.event.inputs.max_sends || '5' }}"
          echo "Executing: python -m outreach send --max $MAX_SENDS $EXTRA_FLAGS"
          python -m outreach send --max "$MAX_SENDS" $EXTRA_FLAGS

      - name: Push fresh dashboard snapshot
        run: python -m outreach dashboard-sync

      - name: Alert Telegram on failure
        if: failure()
        run: |
          python -c "
          from outreach import alerts
          alerts.send_alert('workflow_failure', '❌ Scheduled Outreach run failed in GitHub Actions. Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}', cooldown_minutes=5)
          " || true
