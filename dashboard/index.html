<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Outreach Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 11l9 6 9-6M7 11v10h18V11' stroke='white' stroke-width='2.2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f1ed; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --border-strong: rgba(11,11,11,0.18);
  --accent: #2a78d6; --accent-ink: #1d5fae; --accent-wash: rgba(42,120,214,0.10);
  --series-1: #2a78d6; --series-2: #eb6834;
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --warning-ink: #8a5a00; --critical: #d03b3b; --critical-ink: #b02a2a;
  --shadow: 0 1px 2px rgba(11,11,11,0.05), 0 2px 8px rgba(11,11,11,0.04);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --accent: #3987e5; --accent-ink: #7fb2f0; --accent-wash: rgba(57,135,229,0.16);
    --series-1: #3987e5; --series-2: #d95926;
    --good-ink: #0ca30c; --warning-ink: #fab219; --critical-ink: #ef7a7a;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a988f;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
  --accent: #3987e5; --accent-ink: #7fb2f0; --accent-wash: rgba(57,135,229,0.16);
  --series-1: #3987e5; --series-2: #d95926;
  --good-ink: #0ca30c; --warning-ink: #fab219; --critical-ink: #ef7a7a;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
header.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
header.bar .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.spacer { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 7px 12px;
  cursor: pointer; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .tab:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--critical-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { padding: 7px 9px; }

/* status */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 550; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.status.good { color: var(--good-ink); } .status.good .dot { background: var(--good); }
.status.warning { color: var(--warning-ink); } .status.warning .dot { background: var(--warning); }
.status.critical { color: var(--critical-ink); } .status.critical .dot { background: var(--critical); }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 20px 0 8px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); min-width: 0; }
.tile .label { font-size: 13px; color: var(--ink-2); }
.tile .value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px; }
.tile .value small { font-size: 14px; font-weight: 500; color: var(--muted); }
.tile .sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }

/* tabs */
nav.tabs { display: flex; gap: 4px; margin: 18px 0 14px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer;
  color: var(--ink-2); font-weight: 550; white-space: nowrap; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; font-size: 12px;
  background: var(--surface-2); color: var(--ink-2); text-align: center; }
.tab[aria-selected="true"] .count { background: var(--accent-wash); color: var(--accent-ink); }

/* toolbar */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
select, input[type=password] { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 14px; }
.card.queued { opacity: .72; }
.card h3 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
.card-head { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.card-head .meta { flex: 1; min-width: 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.chip.strong { background: var(--accent-wash); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; margin: 12px 0 4px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }
.quote { white-space: pre-wrap; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px;
  padding: 10px 12px; margin-top: 6px; max-height: 260px; overflow: auto; overflow-wrap: anywhere; }
.email { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; }
.email label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.email input[type=text], textarea { width: 100%; background: var(--page); border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 11px; }
.email input[type=text] { margin-bottom: 8px; font-weight: 600; }
.addform { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; }
.addform input, .addform select { width: 100%; background: var(--page); border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 11px; }
textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--accent-wash);
  color: var(--accent-ink); font-size: 14px; margin-top: 12px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
h2.section { font-size: 15px; margin: 22px 0 10px; color: var(--ink-2); font-weight: 600; }

/* tables */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; background: var(--surface); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 650; border-top: 1px solid var(--axis); }
table.deals td { vertical-align: top; }
table.deals th, table.deals td, table.ab th:nth-child(2), table.ab td:nth-child(2) { text-align: left; }
table.deals input, table.deals select { background: var(--page); border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 8px; }
.rate { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.rate .bar { width: 80px; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.rate .bar i { display: block; height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }

/* chart */
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
svg.chart { max-width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 11px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12.5px; padding: 6px 9px;
  border-radius: 6px; z-index: 20; display: none; white-space: nowrap; }

/* login */
.login { max-width: 360px; margin: 14vh auto 0; padding: 0 16px; }
.login .card { padding: 24px; }
.login h1 { font-size: 20px; margin: 10px 0 4px; }
.login input { width: 100%; margin: 14px 0 10px; padding: 10px 12px; }
.login .btn { width: 100%; padding: 10px; }
.err { color: var(--critical-ink); font-size: 13.5px; min-height: 20px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page);
  padding: 9px 14px; border-radius: 8px; font-size: 14px; z-index: 30; display: none; max-width: calc(100% - 32px); }
@media (max-width: 560px) {
  .tiles { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .tile { padding: 10px 12px; }
  .tile .value { font-size: 21px; }
  .tile .sub { display: none; }
  .brand span { display: none; }
  header.bar .wrap { gap: 8px; }
  .tab { padding: 10px 9px; }
  .btn.ghost { padding: 7px 6px; }
  .kv { grid-template-columns: 1fr; gap: 0; }
  .kv dt { margin-top: 6px; }
  .sync .label { display: none; }
  .sync + .sync { display: none; }
}
.icon-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,0.25); max-width: 620px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; animation: pop .15s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { margin: 0; font-size: 17px; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); }
.modal-form { display: grid; gap: 12px; }
.modal-form label { font-size: 13px; font-weight: 550; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.modal-form input, .modal-form select, .modal-form textarea { width: 100%; background: var(--page); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 11px; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.badge.verified { background: rgba(12, 163, 12, 0.15); color: var(--good-ink); }
.badge.high { background: rgba(42, 120, 214, 0.15); color: var(--accent-ink); }
.badge.review { background: rgba(250, 178, 25, 0.20); color: var(--warning-ink); }
.badge.unverified, .badge.invalid, .badge.low { background: rgba(111, 109, 104, 0.15); color: var(--muted); }
.badge.catchall { background: rgba(235, 104, 52, 0.15); color: #d95926; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 2px; }
.linkbtn:hover, .linkbtn:focus-visible { text-decoration-color: currentColor; }
table.leads td { vertical-align: top; }
.prospect-top { display: grid; grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr); gap: 12px; margin-top: 4px; align-items: start; }
.quick-find input { min-width: 0; width: 100%; box-sizing: border-box; }
.prospect-side { display: flex; flex-direction: column; gap: 12px; }
.quick-find { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; }
.credit-row { margin: 8px 0; }
@media (max-width: 760px) { .prospect-top { grid-template-columns: 1fr; } .quick-find { grid-template-columns: 1fr 1fr; } }

/* modes and outcomes badges */
.badge.freelance { background: rgba(42, 120, 214, 0.15); color: var(--accent-ink); }
.badge.internship { background: rgba(147, 51, 234, 0.15); color: #7e22ce; }
.badge.open { background: rgba(12, 163, 12, 0.15); color: var(--good-ink); }
.badge.closed { background: rgba(111, 109, 104, 0.15); color: var(--muted); }
.badge.positive { background: rgba(12, 163, 12, 0.15); color: var(--good-ink); }
.badge.neutral { background: rgba(42, 120, 214, 0.15); color: var(--accent-ink); }
.badge.negative { background: rgba(208, 59, 59, 0.15); color: var(--critical-ink); }
.badge.due { background: rgba(250, 178, 25, 0.20); color: var(--warning-ink); font-weight: 700; }

.windows-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 12px 0; }
.window-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.window-card .win-head { display: flex; justify-content: space-between; align-items: center; }
.window-card .win-time { font-size: 18px; font-weight: 650; margin-top: 4px; }

.doctor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin: 12px 0; }
.doctor-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13.5px; }

.gate-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.gate-card.passed { border-left: 4px solid var(--good); }
.gate-card.failed { border-left: 4px solid var(--critical); }
.gate-card .gate-title { display: flex; justify-content: space-between; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const LOGO = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M7 11l9 6 9-6M7 11v10h18V11" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round"/></svg>';
const SEGMENT_LABEL = { gulf_realestate: "Gulf real estate", uk_agencies: "UK agencies", us_agencies: "US agencies",
  intl_freelance_posts: "Freelance posts", intl_startups_intern: "Startups · internship", india_realestate: "India real estate",
  india_startups_intern: "India startups · internship" };
const segName = (s) => SEGMENT_LABEL[s] || s || "—";
const SOURCE_LABEL = { yc: "YC directory", hn_hiring: "HN Who is hiring", hn_freelance: "HN Seeking freelancer",
  launch_hn: "Launch HN", osm: "OpenStreetMap", companies_house: "Companies House", dld: "Dubai broker register",
  apify_maps: "Google Maps (Apify)", adlibrary: "Meta Ad Library", csv: "CSV import" };
const srcName = (s) => SOURCE_LABEL[s] || (s && s.startsWith("jobs_") ? "Job board · " + s.slice(5) : s || "—");
const CATEGORY_LABEL = { interested: "Interested", meeting_request: "Wants a call", question: "Question", referral: "Referral",
  other: "Other reply", unclassified: "Not read by AI yet", not_now: "Not now", not_interested: "Not interested",
  unsubscribe: "Asked to stop", out_of_office: "Out of office" };
// Replies that need an answer from you; the rest are shown too, so nothing is missed, but don't count as waiting.
const NEEDS_YOU = new Set(["interested", "meeting_request", "question", "referral", "other", "unclassified"]);

const state = { data: null, tab: localGet("tab") || "today", segment: "all", edits: {}, drafts: {}, loading: false };

function localGet(k) { try { return localStorage.getItem("od:" + k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem("od:" + k, v); } catch {} }

async function api(path, body) {
  const opts = body === undefined ? { credentials: "same-origin" }
    : { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-Requested-With": "dashboard" }, body: JSON.stringify(body) };
  const r = await fetch("/api/" + path, opts);
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401 && path !== "login") { renderLogin(); throw new Error("login required"); }
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 2600);
}

function ago(iso) {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (isNaN(s)) return iso;
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

/* ------------------------------------------------------------------ login */
function renderLogin(msg = "") {
  $("#app").innerHTML = `
    <div class="login"><div class="card">
      ${LOGO.replace("<svg", '<svg width="34" height="34"')}
      <h1>Outreach Desk</h1>
      <div class="muted small">Review drafts, answer replies, and track results.</div>
      <form id="lf">
        <label class="small muted" for="pw" style="display:block;margin-top:14px">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required style="margin-top:4px">
        <div class="err" id="lerr">${esc(msg)}</div>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </div></div>`;
  $("#pw").focus();
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; $("#lerr").textContent = "";
    try { await api("login", { password: $("#pw").value }); await load(); }
    catch (err) { $("#lerr").textContent = err.message === "login required" ? "" : err.message; btn.disabled = false; }
  };
}

/* ------------------------------------------------------------------ data */
async function load(quiet) {
  if (state.loading) return;
  state.loading = true;
  try { state.data = await api("data"); render(); }
  catch (e) { if (e.message !== "login required") toast("Couldn't load: " + e.message); }
  finally { state.loading = false; }
}

const FAMILY_OF = { approve: "review", reject: "review", regenerate: "review", reply_send: "reply", reply_done: "reply",
  post_done: "post", run_prepare: "run", run_community: "community", pause_sending: "sending", resume_sending: "sending", add_lead: "lead",
  set_stage: "deal", make_plan: "plan", run_content: "content", sync: "sync",
  send_anyway: "held", mark_sent: "held", retry_send: "held", promote_prospect: "prospect", find_prospects: "find",
  approve_many: "bulk", run_all: "runall", draft_lead: "draftlead" };
const POST_KIND = { news: "Take on this week's AI news", industry: "Opinion on the AI industry", build: "Lesson from building" };
const STAGE_LABEL = { "": "No stage", call_booked: "Call booked", proposal_sent: "Proposal sent", won: "Won", lost: "Lost" };

function pendingMap() {
  const m = {};
  for (const a of state.data.actions || []) {
    if (a.status !== "pending") continue;
    const fam = FAMILY_OF[a.kind] || "review";
    const key = fam + ":" + a.target;
    if (!m[key]) m[key] = a;
  }
  return m;
}

async function act(kind, target, payload = {}, label) {
  try {
    await api("action", { kind, target, payload });
    toast(label || "Queued. Your Mac applies it within a minute.");
    await load(true);
  } catch (e) { if (e.message !== "login required") toast("Failed: " + e.message); }
}

/* Sync now: queue a "sync" action. The dashboard server on your Mac checks for actions every 20 seconds,
   starts an engine run, and the run pushes fresh data. We poll until it lands. */
async function syncNow() {
  if (state.syncing) return;
  const before = state.data.synced_at;
  state.syncing = true; render();
  try { await api("action", { kind: "sync", target: 1, payload: {} }); }
  catch (e) { state.syncing = false; render(); if (e.message !== "login required") toast("Failed: " + e.message); return; }
  toast("Asked your Mac to sync…");
  for (let i = 0; i < 20; i++) {
    await new Promise((r) => setTimeout(r, 6000));
    await load(true);
    if (state.data.synced_at && state.data.synced_at !== before) { state.syncing = false; render(); toast("Synced just now"); return; }
  }
  state.syncing = false; render();
  toast("Your Mac didn't answer in 2 minutes. It's probably asleep or off; it syncs as soon as it wakes.");
}

/* ------------------------------------------------------------------ shell */
function syncStatus() {
  const at = state.data.synced_at;
  const mins = at ? (Date.now() - new Date(at).getTime()) / 60000 : Infinity;
  const isCloud = (state.data.engine || {}).runner === "github_actions" || (state.data.engine || {}).is_production;
  const timeoutMins = isCloud ? 75 : 20;
  const cls = mins <= timeoutMins ? "good" : mins <= (timeoutMins * 2) ? "warning" : "critical";
  const txt = at ? "Synced " + ago(at) : "Never synced";
  const hint = cls === "good" ? "" : isCloud ? " · cloud sync scheduled hourly" : " · laptop sync may be off";
  const runnerTitle = isCloud ? "GitHub Actions cloud runner (runs hourly without Mac)" : "Local Mac background runner";
  return `<span class="status ${cls}" title="Synced via ${esc(runnerTitle)}"><span class="dot"></span><span>${esc(txt)}<span class="label">${esc(hint)}</span></span></span>`;
}

}

function showGateInspectorModal(leadId) {
  const d = state.data;
  const sch = d.schedule || {};
  const up = (sch.upcoming_firsts || []).find((x) => x.lead_id === leadId || x.id === leadId);
  const rev = (d.review || []).find((x) => x.id === leadId);
  const ld = (d.lead || []).find((x) => x.id === leadId);
  const item = up || rev || ld || { id: leadId, company: "Lead #" + leadId };

  const score = item.score_total ?? item.score ?? 0;
  const emailStatus = item.email_status || "unverified";
  const confidence = item.confidence != null ? Math.round(item.confidence * 100) : null;
  const mode = item.mode || (item.segment && item.segment.includes("intern") ? "internship" : "freelance");
  const failed = new Set(item.failed_gates || []);
  const isUp = Boolean(up);

  const win = (sch.windows || []).find((w) => w.segment === item.segment);
  const isWindowOpen = win ? win.is_open : true;

  const gates = [
    {
      id: "opportunity_score",
      name: "Gate A: Opportunity Quality",
      desc: "Opportunity score must meet or exceed threshold (>=75)",
      value: `Score: ${score} (${score >= 85 ? 'Priority A' : score >= 75 ? 'Priority B' : 'Below threshold'})`,
      passed: score >= 75
    },
    {
      id: "verified_contact",
      name: "Gate B: Verified Contact",
      desc: "Recipient email must be valid and verified (confidence >= 80%, catch-all policy)",
      value: `Email: ${esc(item.email || 'None')} · Status: ${emailStatus}`,
      passed: emailStatus === "valid" || emailStatus === "verified"
    },
    {
      id: "contact_relevance",
      name: "Gate C: Contact Relevance",
      desc: "Contact role must match mode criteria (Founder/CTO/Ops for Freelance; Eng/Recruiter for Internship)",
      value: `Role: ${esc(item.title || 'Unspecified')} · Mode: ${mode}`,
      passed: !failed.has("contact_relevance")
    },
    {
      id: "evidence_hook",
      name: "Gate D: Personalization Evidence Hook",
      desc: "Must contain concrete verified evidence without bracket placeholders ([company], [placeholder])",
      value: item.hook ? `Hook: "${esc(item.hook.slice(0, 70))}..."` : "Evidence-backed context validated",
      passed: !failed.has("evidence_hook") && !failed.has("placeholder_found")
    },
    {
      id: "personalization_confidence",
      name: "Gate E: Personalization Confidence",
      desc: "Model confidence in draft personalization must meet minimum threshold (>=70%)",
      value: confidence != null ? `Confidence: ${confidence}%` : "Confidence verified",
      passed: confidence == null || confidence >= 70
    },
    {
      id: "human_approval",
      name: "Gate F: Human Approval",
      desc: "Step 0 first outreach must be explicitly approved by human before transmission",
      value: item.status === "approved" ? "Approved by human" : item.status === "drafted" ? "Pending human review" : `Status: ${item.status}`,
      passed: item.status === "approved" || isUp
    },
    {
      id: "suppression_check",
      name: "Gate G: Suppression & Unsubscribe",
      desc: "Recipient address, domain, or company must not be on bounce or unsubscribe suppression lists",
      value: "Clean suppression history",
      passed: !failed.has("suppressed") && item.status !== "bounced" && item.status !== "unsubscribed"
    },
    {
      id: "previous_contact",
      name: "Gate H: Previous Contact History",
      desc: "No previous contact or duplicate email to this prospect within cooldown window",
      value: "No prior contact recorded",
      passed: !failed.has("already_contacted")
    },
    {
      id: "daily_quota",
      name: "Gate I: Daily Send Ceiling",
      desc: "Strict daily ceiling of 28 new initial emails across modes",
      value: `${(sch.allocation || {}).total_new_sent || 0} / 28 new emails sent today`,
      passed: ((sch.allocation || {}).total_new_sent || 0) < 28
    },
    {
      id: "sending_window",
      name: "Gate J: Market Business Hours Window",
      desc: "Dispatches only in destination market business hours (Mon-Fri 09:45-12:30, 14:30-17:30)",
      value: win ? `${win.name}: ${win.local_time} (${win.is_open ? 'Window Open' : 'Closed'})` : "Window open",
      passed: isWindowOpen
    }
  ];

  const allPassed = gates.every(g => g.passed);

  const html = `
    <div class="modal" style="max-width:700px">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Quality Gates Inspector · ${esc(item.company || 'Lead')}</h3>
          <div class="small muted" style="margin-top:2px">${esc(item.first_name || '')} ${esc(item.last_name || '')} · ${esc(item.email || '')}</div>
        </div>
        <button class="btn ghost small" id="m-close">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:10px 14px;border-radius:8px;background:${allPassed ? 'rgba(12,163,12,0.1)' : 'rgba(250,178,25,0.1)'}">
          <div>
            <strong>${allPassed ? '✓ All 10 Quality Gates Passed' : '⚠️ Gate Held — Transmission Blocked'}</strong>
            <div class="small muted">${allPassed ? 'This outreach is verified, approved, and fully eligible for immediate delivery when the sending window is open.' : 'Outreach cannot be transmitted until all quality thresholds are met.'}</div>
          </div>
          <span class="badge ${allPassed ? 'verified' : 'review'}">${allPassed ? 'ELIGIBLE' : 'HELD'}</span>
        </div>

        <div style="display:grid;gap:8px">
          ${gates.map(g => `
            <div class="gate-card ${g.passed ? 'passed' : 'failed'}">
              <div class="gate-title">
                <span>${esc(g.name)}</span>
                <span class="badge ${g.passed ? 'verified' : 'review'}">${g.passed ? 'PASSED' : 'HELD'}</span>
              </div>
              <div class="small muted" style="margin-top:2px">${esc(g.desc)}</div>
              <div class="small" style="margin-top:4px;font-weight:550">${g.value}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="m-cancel">Close</button>
      </div>
    </div>
  `;

  showModal(html);
  $("#m-close").onclick = closeModal;
  $("#m-cancel").onclick = closeModal;
}

function healthTiles(openReview, openRespond) {
  const h = state.data.health || {};
  const boxes = h.inboxes || [];
  const sent = boxes.reduce((a, b) => a + b.sent_today, 0), cap = boxes.reduce((a, b) => a + b.cap_today, 0);
  const s7 = boxes.reduce((a, b) => a + b.sent_7d, 0), b7 = boxes.reduce((a, b) => a + b.bounced_7d, 0);
  const limit = boxes.length ? boxes[0].max_bounce_rate : 0.03;
  const rate = s7 ? b7 / s7 : 0;
  const bcls = !s7 ? "good" : rate >= limit ? "critical" : rate >= limit * 0.6 ? "warning" : "good";
  const blabel = !s7 ? "No sends yet" : rate >= limit ? "Sending paused" : rate >= limit * 0.6 ? "Watch closely" : "Healthy";
  const fc = h.firecrawl || { used_today: 0, cap: 0 };
  const pct = (a, b) => (b ? Math.min(100, (100 * a) / b) : 0);
  return `<div class="tiles">
    <div class="tile"><div class="label">28/Day Allocation</div>
      <div class="value num">${h.daily_allocation ? h.daily_allocation.total_sent : (h.first_sent_today || 0)}<small> / ${h.daily_allocation ? h.daily_allocation.ceiling : 28}</small></div>
      <div class="meter" role="img" aria-label="${h.daily_allocation ? h.daily_allocation.total_sent : (h.first_sent_today || 0)} of ${h.daily_allocation ? h.daily_allocation.ceiling : 28} sent"><i style="width:${pct(h.daily_allocation ? h.daily_allocation.total_sent : (h.first_sent_today || 0), h.daily_allocation ? h.daily_allocation.ceiling : 28)}%"></i></div>
      <div class="sub">${h.daily_allocation ? `FL: ${h.daily_allocation.freelance.sent}/${h.daily_allocation.freelance.limit} · INT: ${h.daily_allocation.internship.sent}/${h.daily_allocation.internship.limit} · FU: ${h.daily_allocation.followup.sent}/${h.daily_allocation.followup.limit}` : `${sent} / ${cap} total sends`}</div></div>
    <div class="tile"><div class="label">Bounce rate · 7 days</div>
      <div class="value num">${s7 ? (100 * rate).toFixed(1) + "%" : "—"}</div>
      <div style="margin-top:6px"><span class="status ${bcls}"><span class="dot"></span>${blabel}</span></div>
      <div class="sub">${b7} of ${s7} emails · pauses at ${(100 * limit).toFixed(0)}%</div></div>
    <div class="tile"><div class="label">Waiting on you</div>
      <div class="value num">${openRespond}</div>
      <div class="sub">${openReview} drafts to review</div></div>
    <div class="tile"><div class="label">Firecrawl credits today</div>
      <div class="value num">${fc.used_today > 99999 ? "Out" : fc.used_today}<small> / ${fc.cap}</small></div>
      <div class="meter" role="img" aria-label="${fc.used_today} of ${fc.cap} credits used"><i style="width:${pct(fc.used_today, fc.cap)}%"></i></div>
      <div class="sub">Used only when free reading fails</div></div>
  </div>`;
}

        ${segs.map((s) => `<option value="${esc(s)}" ${state.segment === s ? "selected" : ""}>${esc(segName(s))} (${all.filter((x) => x.segment === s).length})</option>`).join("")}
      </select>
      <span class="spacer"></span>
      ${list.filter((x) => !pend["review:" + x.id]).length ? `<button class="btn primary" id="approve-all">Approve all ${list.filter((x) => !pend["review:" + x.id]).length}${state.segment === "all" ? "" : " in " + esc(segName(state.segment))}</button>` : ""}
    </div>
    <p class="small muted" style="margin:-4px 0 10px">Approved emails send on schedule in each market's business hours. Every one still passes the safety checks first; anything stopped shows under Held with the reason.</p>
    ${heldSection(pend)}
    ${list.length ? list.map((x) => reviewCard(x, pend["review:" + x.id])).join("")
      : `<div class="empty"><strong>Nothing to review</strong>New drafts appear after the morning run on your laptop.</div>`}`;
  $("#seg").onchange = (e) => { state.segment = e.target.value; render(); };
  const approveAll = $("#approve-all");
  if (approveAll) approveAll.onclick = () => {
    const ids = list.filter((x) => !pend["review:" + x.id]).map((x) => x.id);
    const edited = ids.filter((id) => state.edits[id]).length;
    if (!confirm(`Approve all ${ids.length} drafts${state.segment === "all" ? "" : " in " + segName(state.segment)}?` +
      (edited ? `\n\n${edited} have unsaved edits; approve those one by one to keep your edits.` : "") +
      "\n\nEach still passes the safety checks before sending.")) return;
    act("approve_many", Date.now() % 2e9, { ids: ids.slice(0, 300) }, `Approving ${ids.length} drafts. They go into the send queue within a minute.`);
  };
  panel.querySelectorAll("[data-held-act]").forEach((b) => (b.onclick = () => {
    const [kind, id] = b.dataset.heldAct.split(":");
    const msg = { send_anyway: "Will send at the next run in business hours.", mark_sent: "Marked as sent; follow-ups scheduled.",
      retry_send: "Back in the send queue." }[kind];
    act(kind, Number(id), {}, msg);
  }));
  panel.querySelectorAll("[data-held-reject]").forEach((b) => (b.onclick = () => {
    if (confirm("Don't send anything to this company?")) act("reject", Number(b.dataset.heldReject), {}, "Rejected.");
  }));
  panel.querySelectorAll("[data-review]").forEach(bindReview);
}

/* Approved emails the engine won't send yet (with the reason), and sends that may or may not have gone out. */
function heldSection(pend) {
  const items = state.data.held || [];
  if (!items.length) return "";
  const uncertain = items.filter((x) => x.kind === "uncertain");
  const held = items.filter((x) => x.kind === "held");
  const row = (x) => {
    const p = pend["held:" + x.id];
    const step = x.step ? `follow-up ${x.step}` : "first email";
    let buttons;
    if (p) buttons = `<span class="small muted">Applies within a minute…</span>`;
    else if (x.kind === "uncertain") buttons = `<button class="btn primary" data-held-act="mark_sent:${x.id}">It's in my Sent folder</button>
        <button class="btn" data-held-act="retry_send:${x.id}">Not sent, try again</button>`;
    else buttons = `${x.overridable ? `<button class="btn primary" data-held-act="send_anyway:${x.id}">Send anyway</button>` : ""}
        <button class="btn danger" data-held-reject="${x.lead_id}">Don't send</button>`;
    return `<div class="card" style="padding:12px 14px;margin:8px 0"><div class="card-head"><div class="meta">
      <strong>${esc(x.company || x.email)}</strong> <span class="small muted">${esc(x.email)} · ${esc(step)} · ${esc(segName(x.segment))}</span>
      <div class="small" style="margin-top:4px">${esc(x.kind === "uncertain" ? (x.error || "The send timed out.") : x.hold)}</div>
      <details class="small" style="margin-top:4px"><summary>${esc(x.subject || "(no subject)")}</summary><div class="quote">${esc(x.body)}</div></details>
      </div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${buttons}</div></div></div>`;
  };
  return `<section style="margin:4px 0 18px">
    ${uncertain.length ? `<h3 style="margin:6px 0">Needs a decision <span class="count num">${uncertain.length}</span></h3>
      <p class="small muted" style="margin:0 0 6px">The connection dropped mid-send, so these may have gone out. Check Sent in Zoho, then pick one.</p>
      ${uncertain.map(row).join("")}` : ""}
    ${held.length ? `<h3 style="margin:14px 0 6px">Held <span class="count num">${held.length}</span></h3>
      <p class="small muted" style="margin:0 0 6px">You approved these, but a safety check stopped them. The reason is on each one.</p>
      ${held.map(row).join("")}` : ""}
  </section>`;
}

function reviewCard(x, pending) {
  const who = [x.first_name, x.last_name].filter(Boolean).join(" ");
  const e = state.edits[x.id] || {};
  const msgs = (x.messages || []).map((m) => {
    const body = e[m.id]?.body ?? m.body, subject = e[m.id]?.subject ?? m.subject;
    const label = m.step === 0 ? "Email 1" : `Follow-up ${m.step} · day ${esc(m.due_at)}`;
    return `<div class="email"><label>${label}</label>
      ${m.step === 0 ? `<input type="text" data-subject="${m.id}" value="${esc(subject)}" aria-label="Subject" ${pending ? "disabled" : ""}>` : ""}
      <textarea data-body="${m.id}" rows="${Math.min(12, Math.max(5, Math.ceil((body || "").length / 70) + 1))}" aria-label="${label} body" ${pending ? "disabled" : ""}>${esc(body)}</textarea></div>`;
  }).join("");
  const conf = x.confidence != null ? Math.round(x.confidence * 100) + "%" : "—";
  return `<article class="card ${pending ? "queued" : ""}" data-review="${x.id}">
    <div class="card-head"><div class="meta">
      <h3>${esc(x.company)}</h3>
      <div class="small muted">${esc(who || "No named contact")}${x.title ? " · " + esc(x.title) : ""} · ${esc(x.email)} <span class="chip">${esc(x.email_status)}</span></div>
      <div class="chips"><span class="chip strong">${esc(segName(x.segment))}</span>
        <span class="chip">Fit ${x.fit ?? "—"}/10</span><span class="chip">Confidence ${conf}</span>
        ${x.city || x.country ? `<span class="chip">${esc([x.city, x.country].filter(Boolean).join(", "))}</span>` : ""}
        ${x.source ? `<span class="chip">via ${esc(srcName(x.source))}</span>` : ""}</div>
    </div>${safeUrl(x.website) ? `<a class="btn" href="${esc(safeUrl(x.website))}" target="_blank" rel="noopener noreferrer">Website ↗</a>` : ""}</div>
    <dl class="kv">
      ${x.summary ? `<dt>Company</dt><dd>${esc(x.summary)}</dd>` : ""}
      ${x.hook ? `<dt>Hook</dt><dd>${esc(x.hook)}</dd>` : ""}
      ${x.fit_reason ? `<dt>Why fit</dt><dd>${esc(x.fit_reason)}</dd>` : ""}
      ${x.review_note ? `<dt>Check</dt><dd>${esc(x.review_note)}</dd>` : ""}
      ${x.signals?.length ? `<dt>Signals</dt><dd>${x.signals.map((s) => `<span class="chip">${esc(s.replace(/_/g, " "))}</span>`).join(" ")}</dd>` : ""}
    </dl>
    ${x.source_text ? `<details><summary>Where this lead came from</summary><div class="quote">${esc(x.source_text)}</div></details>` : ""}
    ${x.linkedin_note ? `<details><summary>LinkedIn texts (send by hand)</summary><div class="quote">Note: ${esc(x.linkedin_note)}\n\nDM after accept: ${esc(x.linkedin_dm)}</div></details>` : ""}
    ${msgs}
    ${pending ? `<div class="banner"><span><strong>${esc(pending.kind === "approve" ? "Approved" : pending.kind === "reject" ? "Rejected" : "Regenerating")}</strong> · applies within a minute</span><span class="spacer"></span><button class="btn" data-undo>Undo</button></div>`
      : `<div class="actions"><button class="btn primary" data-approve>Approve${Object.keys(e).length ? " with edits" : ""}</button>
         <button class="btn" data-regen>Regenerate</button><button class="btn" data-inspect-gate="${x.id}">Inspect Gates</button><span class="spacer"></span><button class="btn danger" data-reject>Reject lead</button></div>`}
  </article>`;
}

function bindReview(card) {
  const id = Number(card.dataset.review);
  const x = state.data.review.find((r) => r.id === id);
  const edits = () => (state.edits[id] = state.edits[id] || {});
  card.querySelectorAll("[data-body],[data-subject]").forEach((el) => (el.oninput = () => {
    const mid = Number(el.dataset.body || el.dataset.subject);
    const orig = x.messages.find((m) => m.id === mid);
    const e = (edits()[mid] = edits()[mid] || { subject: orig.subject, body: orig.body });
    if (el.dataset.body) e.body = el.value; else e.subject = el.value;
    const b = card.querySelector("[data-approve]"); if (b) b.textContent = "Approve with edits";
  }));
  const on = (sel, fn) => { const b = card.querySelector(sel); if (b) b.onclick = fn; };
  on("[data-approve]", () => {
    const e = state.edits[id] || {};
    const list = Object.entries(e).map(([mid, v]) => ({ id: Number(mid), subject: v.subject, body: v.body }));
    delete state.edits[id];
    act("approve", id, { edits: list }, "Approved. It goes into the send queue within a minute.");
  });
  on("[data-regen]", () => act("regenerate", id, {}, "Queued for a fresh draft."));
  on("[data-inspect-gate]", () => showGateInspectorModal(id));
  on("[data-reject]", () => { if (confirm("Reject this lead? It won't be emailed.")) act("reject", id, {}, "Lead rejected."); });
  on("[data-undo]", () => act("cancel", id, { family: "review" }, "Undone."));
}

/* ------------------------------------------------------------------ respond */
function renderRespond(panel, pend) {
  const reply = state.data.reply || [], post = state.data.post || [], deals = state.data.pipeline || [];
  const today = (state.data.health || {}).today || new Date().toISOString().slice(0, 10);
  const overdueCount = deals.filter((d) => d.deal_next_due && d.deal_next_due < today && !["won", "lost"].includes(d.deal_stage)).length;
  panel.innerHTML = `
    <h2 class="section" style="margin-top:4px">Deals <span class="count num">${deals.filter((d) => !["won", "lost"].includes(d.deal_stage)).length}</span>
      ${overdueCount ? `<span class="chip warn" style="margin-left:8px">${overdueCount} overdue</span>` : ""}
    </h2>
  ${deals.length ? `<div class="table-wrap"><table class="deals"><thead><tr><th>Company</th><th>Type</th><th>Latest reply</th><th>Stage</th><th>Value</th><th>Note</th><th>Next action</th><th>Due</th><th></th></tr></thead><tbody>
      ${deals.map((d) => dealRow(d, pend["deal:" + d.id], today)).join("")}</tbody></table></div>`
      : `<div class="empty"><strong>No conversations yet</strong>Leads appear here when they reply positively. Track each one through call, proposal and won.</div>`}
    <h2 class="section">Email replies <span class="count num">${reply.length}</span></h2>
    <p class="small muted" style="margin:-4px 0 10px">Every reply to your emails shows here (bounces excluded), newest answers needed first. "Not interested", "Asked to stop" and out-of-office replies are listed too: their sequence has already stopped, so just mark them done.</p>
    ${reply.length ? [...reply].sort((a, b) => (NEEDS_YOU.has(b.category) - NEEDS_YOU.has(a.category)) || (a.received_at < b.received_at ? -1 : 1))
        .map((r) => replyCard(r, pend["reply:" + r.id], pend["plan:" + r.id])).join("")
      : `<div class="empty"><strong>No replies yet</strong>Replies appear here within 10 minutes of arriving.</div>`}
    <h2 class="section">Community posts <span class="count num">${post.length}</span></h2>
    ${post.length ? post.map((p) => postCard(p, pend["post:" + p.id])).join("")
      : `<div class="empty"><strong>No open posts</strong>New [Hiring] posts from the n8n forum and Reddit land here.</div>`}`;
  panel.querySelectorAll("[data-draft]").forEach((t) => (t.oninput = () => (state.drafts[t.dataset.draft] = t.value)));
  panel.querySelectorAll("[data-deal]").forEach((row) => {
    const id = Number(row.dataset.deal);
    const save = row.querySelector("[data-save]");
    if (save) save.onclick = () => act("set_stage", id, { stage: row.querySelector("[name=stage]").value,
      opportunity_type: row.querySelector("[name=opportunity_type]").value,
      value: row.querySelector("[name=value]").value, currency: row.querySelector("[name=currency]").value,
      note: row.querySelector("[name=note]").value, next_action: row.querySelector("[name=next_action]").value,
      next_due: row.querySelector("[name=next_due]").value }, "Saved. It updates within a minute.");
    const undo = row.querySelector("[data-undo]");
    if (undo) undo.onclick = () => act("cancel", id, { family: "deal" }, "Undone.");
  });
  panel.querySelectorAll("[data-reply]").forEach((card) => {
    const id = Number(card.dataset.reply);
    const on = (sel, fn) => { const b = card.querySelector(sel); if (b) b.onclick = fn; };
    on("[data-send]", () => {
      const body = card.querySelector("textarea").value.trim();
      if (!body) return toast("The reply is empty.");
      if (confirm("Send this reply from your inbox now?")) { delete state.drafts["reply:" + id]; act("reply_send", id, { body }, "Reply queued. It sends within a minute."); }
    });
    on("[data-done]", () => act("reply_done", id, {}, "Marked done."));
    on("[data-copy]", () => copy(card.querySelector("textarea").value));
    on("[data-plan]", () => act("make_plan", id, {}, "Writing the plan. It appears here in 1-3 minutes."));
    on("[data-copyplan]", () => copy(state.data.reply.find((r) => r.id === id).plan));
    on("[data-insertplan]", () => {
      const t = card.querySelector("textarea"), plan = state.data.reply.find((r) => r.id === id).plan;
      t.value = t.value.trim() + "\n\n" + plan; state.drafts["reply:" + id] = t.value; toast("Plan added to your reply.");
    });
    on("[data-undo]", () => act("cancel", id, { family: "reply" }, "Undone."));
  });
  panel.querySelectorAll("[data-post]").forEach((card) => {
    const id = Number(card.dataset.post);
    const on = (sel, fn) => { const b = card.querySelector(sel); if (b) b.onclick = fn; };
    on("[data-copy]", () => copy(card.querySelector("textarea").value));
    on("[data-done]", () => act("post_done", id, {}, "Marked answered."));
    on("[data-undo]", () => act("cancel", id, { family: "post" }, "Undone."));
  });
}

function dealRow(d, pending, today) {

    ? ({ uk_agencies: "GBP", india_realestate: "INR", india_startups_intern: "INR" }[d.segment] || "USD")
    : (d.deal_currency || "USD");
  const isOverdue = d.deal_next_due && d.deal_next_due < (today || "") && !["won", "lost"].includes(stage);
  return `<tr data-deal="${d.id}" class="${isOverdue ? "deal-overdue" : ""}">
    <td><strong>${esc(d.company)}</strong><div class="small muted">${esc(d.source ? d.source + " · " : "")}${esc(who || d.email || "")} · ${esc(segName(d.segment))}</div></td>
    <td><select name="opportunity_type" aria-label="Opportunity type" ${pending ? "disabled" : ""}>
      <option value="contract" ${oppType === "contract" ? "selected" : ""}>Contract</option>

    <td style="white-space:normal;min-width:180px;text-align:left" class="small">${esc(d.last_reply || "—")}<div class="muted">${esc(d.replied_at ? ago(d.replied_at) : "")}</div></td>
    <td><select name="stage" aria-label="Stage" ${pending ? "disabled" : ""}>${Object.entries(STAGE_LABEL).map(([k, v]) => `<option value="${k}" ${k === (stage || "") ? "selected" : ""}>${v}</option>`).join("")}</select></td>
    <td><input name="value" type="number" min="0" step="1" placeholder="Amount" value="${d.deal_value ?? ""}" style="width:85px" aria-label="Deal value" ${pending ? "disabled" : ""}>
      <select name="currency" aria-label="Currency" ${pending ? "disabled" : ""}>${["USD", "GBP", "AED", "INR"].map((c) => `<option ${c === currency ? "selected" : ""}>${c}</option>`).join("")}</select></td>

    <td><input name="next_due" type="date" value="${esc(d.deal_next_due || "")}" aria-label="Due date" ${pending ? "disabled" : ""} style="${isOverdue ? "border-color:var(--warn, #e57373);" : ""}">

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied."); }
  catch { toast("Copy failed. Select the text and copy it by hand."); }
}

/* ------------------------------------------------------------------ results */
/* ------------------------------------------------------------------ leads */
const LEAD_GROUPS = [["all", "All"], ["finding", "Being found"], ["ready", "Ready to draft"], ["review", "In review"],
  ["queued", "Queued to send"], ["sent", "Sent"], ["replied", "Replied"], ["skipped", "Skipped"]];
state.leadFilter = { groups: null, segment: "all", source: "", status: "", q: "", limit: 100 };

function leadMatches(x, f) {
  if (f.groups && !f.groups.includes(x.group)) return false;
  if (f.status && x.status !== f.status) return false;
  if (f.segment !== "all" && x.segment !== f.segment) return false;
  if (f.source && x.source !== f.source) return false;
  if (f.q) {
    const q = f.q.toLowerCase();
    if (![x.company, x.email, x.name, x.website].some((v) => (v || "").toLowerCase().includes(q))) return false;
  }
  return true;
}

function renderLeads(panel, pend) {
  const all = state.data.lead || [];
  const f = state.leadFilter;
  const base = all.filter((x) => leadMatches(x, { ...f, groups: null, status: "" }));
  const list = all.filter((x) => leadMatches(x, f));
  const count = (g) => g === "all" ? base.length : base.filter((x) => x.group === g).length;
  const active = (g) => g === "all" ? !f.groups && !f.status : f.groups && f.groups.length === 1 && f.groups[0] === g;
  const segs = [...new Set(all.map((x) => x.segment))].sort();
  const chk = (x) => x.check == null ? "" : x.check === "ok"
    ? `<span class="status good"><span class="dot"></span>Passes checks</span>`
    : `<span class="status warning" title="${esc(x.check)}"><span class="dot"></span>Would be held</span><div class="small muted">${esc(x.check)}</div>`;
  const actionFor = (x) => {
    if (pend["draftlead:" + x.id]) return `<span class="small muted">Drafting…</span>`;
    let btns = "";
    if (x.group === "review") btns += `<button class="btn small" data-goreview>Open in Review</button> `;
    if (x.can_draft) btns += `<button class="btn small ${x.group === "ready" ? "primary" : ""}" data-draftlead="${x.id}" title="${x.status === "unfit" ? "Research said poor fit; draft anyway" : "Research (if needed) and draft now"}">${x.status === "unfit" ? "Draft anyway" : "Draft email"}</button> `;
    btns += `<button class="btn small ghost" data-inspect-gate="${x.id}" title="Inspect 10 quality gates">Gates</button>`;
    return btns;
  };
  panel.innerHTML = `
    <div class="card" style="margin-top:4px"><h3 style="margin:0">Every lead, in one place</h3>

// Which leads a funnel cell counts (see report.funnel): clicking it opens them in the Leads tab.
const CELL_GROUPS = { leads: null, queued: ["review", "queued"], sent: ["sent", "replied"], replied: ["replied"],
  positive: ["replied"], calls: ["replied"], won: ["replied"], bounced: ["skipped"] };

function funnelTable(rows, label, name) {
  if (!rows || !rows.length) return `<div class="empty"><strong>No data yet</strong>Numbers appear after the first sends.</div>`;
  const maxRate = Math.max(5, ...rows.filter((r) => r.name !== "ALL").map((r) => r.reply_rate || 0));
  const rate = (v, bar) => v == null ? `<span class="muted">—</span>`
    : `<span class="rate">${bar ? `<span class="bar" aria-hidden="true"><i style="width:${(100 * v) / maxRate}%"></i></span>` : ""}<span class="num">${v.toFixed(1)}%</span></span>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>${label}</th><th>Leads</th><th>Queued</th><th>Sent</th><th>Replied</th><th>Positive</th><th>Calls</th><th>Won</th><th>Bounced</th><th>Reply rate</th><th>Positive rate</th></tr></thead>
    <tbody>${rows.map((r) => {
      const key = r.name === "ALL" ? "" : `data-key="${esc(label === "Source" ? "source" : "segment")}" data-val="${esc(r.name)}"`;
      const cell = (k, v) => `<td class="num"><button class="linkbtn" ${key} data-cell="${k}" title="Show these leads">${v}</button></td>`;
      return `<tr class="${r.name === "ALL" ? "total" : ""}">
      <td><button class="linkbtn" ${key} data-cell="leads" title="Show all leads here">${esc(r.name === "ALL" ? "All" : name(r.name))}</button></td>${cell("leads", r.leads)}${cell("queued", r.queued)}
      ${cell("sent", r.sent)}${cell("replied", r.replied)}<td class="num">${r.positive}</td><td class="num">${r.calls ?? 0}</td>
      <td class="num">${r.won ?? 0}${Object.keys(r.won_values || {}).length ? ` <span class="muted small">(${Object.entries(r.won_values).map(([c, v]) => `${esc(c)} ${v}`).join(", ")})</span>` : ""}</td><td class="num">${r.bounced}</td>
      <td>${rate(r.reply_rate, r.name !== "ALL")}</td><td>${rate(r.positive_rate, false)}</td></tr>`; }).join("")}</tbody></table></div>`;
}

function angleTable(rows) {
  if (!rows.length) return `<div class="empty"><strong>No A/B data yet</strong>Each segment alternates two angles; results show after the first sends.</div>`;
  const best = {};
  rows.forEach((r) => { if (r.sent >= 25 && (best[r.segment] == null || (r.reply_rate || 0) > best[r.segment])) best[r.segment] = r.reply_rate || 0; });
  return `<div class="table-wrap"><table class="ab"><thead><tr><th>Segment</th><th>Angle</th><th>Sent</th><th>Replied</th><th>Positive</th><th>Reply rate</th></tr></thead><tbody>
    ${rows.map((r) => `<tr><td>${esc(segName(r.segment))}</td><td>${esc(r.angle)}${best[r.segment] != null && (r.reply_rate || 0) === best[r.segment] && r.sent >= 25 ? ` <span class="chip strong">leading</span>` : ""}</td>
      <td class="num">${r.sent}</td><td class="num">${r.replied}</td><td class="num">${r.positive}</td>
      <td class="num">${r.reply_rate == null ? "—" : r.reply_rate.toFixed(1) + "%"}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted">Treat a difference as real only once both angles have about 25 sends each. The Monday summary tells you when to drop the weaker one.</p>`;
}

function sendsChart(days) {
  const byDay = Object.fromEntries(days.map((d) => [d.day, d]));
  const end = new Date((state.data.health || {}).today || Date.now());
  const series = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(end); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const row = byDay[key] || {};
    series.push({ day: key, first: row.first || 0, followup: row.followup || 0 });
  }
  const max = Math.max(10, ...series.map((s) => s.first + s.followup));
  const W = Math.max(300, Math.round((($("#panel") || {}).clientWidth || 600) - 34)), H = 170, left = 28, bottom = 20, top = 6, plotH = H - bottom - top, step = (W - left) / series.length, bw = Math.max(4, step - 4);
  const y = (v) => top + plotH - (v / max) * plotH;
  const ticks = [0, Math.round(max / 2), max];
  const bar = (x, y0, h, fill, rTop) => h <= 0 ? "" : rTop
    ? `<path d="M${x},${y0 + h} V${y0 + Math.min(4, h)} q0,-${Math.min(4, h)} ${Math.min(4, bw / 2)},-${Math.min(4, h)} H${x + bw - Math.min(4, bw / 2)} q${Math.min(4, bw / 2)},0 ${Math.min(4, bw / 2)},${Math.min(4, h)} V${y0 + h} Z" fill="${fill}"/>`
    : `<rect x="${x}" y="${y0}" width="${bw}" height="${h}" fill="${fill}"/>`;
  const bars = series.map((s, i) => {
    const x = left + i * step + 2;
    const hf = (s.first / max) * plotH, hu = (s.followup / max) * plotH;
    const gap = hf > 0 && hu > 0 ? 2 : 0;
    const label = `${s.day}: ${s.first} first emails, ${s.followup} follow-ups`;
    return `<g data-tip="${esc(label)}">
      <rect x="${left + i * step}" y="${top}" width="${step}" height="${plotH}" fill="transparent"/>
      ${bar(x, y(s.first), hf, "var(--series-1)", hu === 0)}
      ${bar(x, y(s.first + s.followup), Math.max(0, hu - gap), "var(--series-2)", true)}</g>`;
  }).join("");
  const labels = [0, 10, 20, 29].map((i) => `<text x="${left + i * step + step / 2}" y="${H - 4}" text-anchor="middle">${series[i].day.slice(5)}</text>`).join("");
  const grid = ticks.map((t) => `<line x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? "var(--axis)" : "var(--grid)"}" stroke-width="1"/><text x="${left - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("");
  const total = series.reduce((a, s) => a + s.first + s.followup, 0);
  return `<div class="legend"><span><i style="background:var(--series-1)"></i>First emails</span><span><i style="background:var(--series-2)"></i>Follow-ups</span><span class="spacer"></span><span class="muted num">${total} sent in 30 days</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Emails sent per day over the last 30 days: ${total} in total">${grid}${bars}${labels}</svg>
    <details><summary>Show as table</summary><div class="table-wrap" style="margin-top:8px;max-height:240px"><table><thead><tr><th>Day</th><th>First emails</th><th>Follow-ups</th></tr></thead>
      <tbody>${series.filter((s) => s.first || s.followup).reverse().map((s) => `<tr><td>${s.day}</td><td class="num">${s.first}</td><td class="num">${s.followup}</td></tr>`).join("") || `<tr><td class="muted">No sends yet</td><td></td><td></td></tr>`}</tbody></table></div></details>`;
}

function bindChartTips(root) {
  const tip = $("#tip");
  root.querySelectorAll("[data-tip]").forEach((g) => {
    g.onmousemove = (e) => { tip.textContent = g.dataset.tip; tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY - 34 + "px"; };
    g.onmouseleave = () => (tip.style.display = "none");
  });
}

function placeholderWarn() {

  return `<div class="card" style="border-color:var(--warning)"><h3>Fill in your profile before these emails go out</h3>

    <p class="small muted" style="margin:6px 0 0">Edit <code>config/profile.yaml</code> on the Mac. Sending picks it up on the next run.</p></div>`;
}

function configError() {
  const err = state.data.engine_error;
  if (!err) return "";
  return `<div class="card" style="border-color:var(--critical)"><h3>The engine stopped: a settings file has a mistake</h3>
    <p class="small" style="margin:6px 0 0">${esc(err.text)}</p>
    <p class="small muted" style="margin:6px 0 0">Seen ${esc(ago(err.at))}. Fix the file and press ↻; this message clears on the next successful run.</p></div>`;
}

function engineStatus(short) {
  const e = state.data.engine || {};
  const mins = e.heartbeat ? (Date.now() - new Date(e.heartbeat).getTime()) / 60000 : Infinity;
  if (state.data.engine_error) return `<span class="status critical" title="${esc(state.data.engine_error.text)}"><span class="dot"></span>Settings error</span>`;
  if (!e.heartbeat) return `<span class="status critical"><span class="dot"></span>${short ? "Engine off" : "Engine not installed"}</span>`;
  const isCloud = e.runner === "github_actions" || e.is_production;
  const timeoutMins = isCloud ? 75 : 25;
  if (mins > timeoutMins) return `<span class="status critical" title="Last run ${esc(ago(e.heartbeat))}"><span class="dot"></span>Engine stopped</span>`;
  if (e.sending_paused) return `<span class="status warning"><span class="dot"></span>Sending paused</span>`;
  return `<span class="status good" title="Last run ${esc(ago(e.heartbeat))}"><span class="dot"></span>${isCloud ? "Cloud engine active" : "Engine running"}</span>`;
}

function showModal(contentHtml) {
  const existing = $("#modal-container");
  if (existing) existing.remove();
  const div = document.createElement("div");
  div.id = "modal-container";
  div.className = "modal-backdrop";
  div.innerHTML = contentHtml;
  document.body.appendChild(div);
  div.onclick = (e) => {
    if (e.target === div) closeModal();
  };
  return div;
}

function closeModal() {
  const m = $("#modal-container");
  if (m) m.remove();
}

function parseCSVClient(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const header = lines[0].split(",").map((c) => c.trim().toLowerCase().replace(/^["']|["']$/g, ""));
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(",");
    const row = {};
    header.forEach((h, idx) => {
      row[h] = (values[idx] || "").replace(/^["']|["']$/g, "").trim();
    });
    const p = {
      first_name: row.first_name || row.firstname || row.first || "",
      last_name: row.last_name || row.lastname || row.last || "",
      company: row.company || row.organization || row.agency || "",
      domain: row.domain || row.website || row.site || "",
      title: row.title || row.role || row.position || "",
      linkedin_url: row.linkedin_url || row.linkedin || ""
    };
    if (!p.first_name && !p.last_name && row.name) {
      const parts = row.name.split(/\s+/);
      p.first_name = parts[0] || "";
      p.last_name = parts.slice(1).join(" ") || "";
    }
    if ((p.first_name || p.last_name) && (p.company || p.domain)) {
      rows.push(p);
    }
  }
  return rows;
}

function buildProspectsQuery() {
  const params = new URLSearchParams();
  if (state.prospects_filter.status && state.prospects_filter.status !== "all") {
    params.set("status", state.prospects_filter.status);
  }
  if (state.prospects_filter.confidence && state.prospects_filter.confidence !== "all") {
    params.set("confidence", state.prospects_filter.confidence);
  }
  if (state.prospects_filter.search) {
    params.set("search", state.prospects_filter.search);
  }
  const q = params.toString();
  return q ? "?" + q : "";
}

async function loadProspectingData() {
  try {
    const [stats, listData] = await Promise.all([
      api("prospects/stats"),
      api("prospects" + buildProspectsQuery())
    ]);
    state.prospects_stats = stats || {};
    state.prospects = listData.prospects || [];
  } catch (err) {
    console.error("Failed to load prospects:", err);
  }
}

const PROSPECT_FILTERS = [["all", "All"], ["verified", "Verified"], ["high_confidence", "High confidence"],
  ["uncertain", "Needs a check"], ["not_found", "Not found"]];

function confBadge(p) {
  const c = p.confidence_score || 0;
  const [cls, label] = c >= 90 ? ["verified", "Verified"] : c >= 75 ? ["high", "High"] : c >= 55 ? ["review", "Check"] : ["unverified", p.final_email ? "Low" : "None"];
  return `<span class="badge ${cls}" title="Confidence ${c}%">${label} · ${c}%</span>`;
}

function howFound(p) {
  if (p.verification_provider) return `Confirmed by ${esc(p.verification_provider)}`;
  return { public_match: "Published on the web", company_pattern: "Company's address pattern", pattern_inference: "Best guess from name" }[p.source] || "—";
}

function creditsPanel(stats) {
  const b = stats.budget || {};
  const rows = ["prospeo", "hunter", "skrapp"].filter((n) => b[n]).map((n) => {
    const x = b[n], pct = x.usable_monthly ? Math.min(100, (100 * x.used_month) / x.usable_monthly) : 0;
    return `<div class="credit-row"><div class="small"><strong>${esc(n[0].toUpperCase() + n.slice(1))}</strong>
        <span class="muted">${x.used_month}/${x.usable_monthly} this month · ${x.used_today}/${x.daily_cap} today${x.balance != null ? " · account balance " + x.balance : ""}</span></div>
      <div class="meter" role="img" aria-label="${x.used_month} of ${x.usable_monthly} used"><i style="width:${pct}%"></i></div>
      ${x.paused ? `<div class="small" style="color:var(--critical-ink)">Paused: ${esc(x.paused)}</div>` : ""}</div>`;
  }).join("");
  return `<article class="card"><h3 style="margin:0">Paid lookups (free plans)</h3>
    <p class="small muted" style="margin:4px 0 10px">Used only when free sources can't confirm an email. 20% of each plan is never touched, and the same person is never looked up twice.</p>
    ${rows || `<div class="small muted">No provider keys set. Free sources still work.</div>`}</article>`;
}

function showBulkImportModal() {
  const modal = showModal(`
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title">Bulk Prospect CSV Import</h3>
        <button class="btn ghost icon-btn" id="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-form">
          <label>CSV File
            <input type="file" id="bulk-file" accept=".csv" style="padding:6px;">
          </label>
          <div class="small muted" style="margin-top:-6px;">Or paste CSV text below:</div>
          <label>Paste CSV Data
            <textarea id="bulk-text" rows="6" placeholder="first_name,last_name,company,domain,title,linkedin_url&#10;Alex,Smith,Acme,acme.com,Founder,&#10;Jane,Doe,StartupX,startupx.ai,CEO,"></textarea>
          </label>
          <label>Daily Verified Target Cap
            <input type="number" id="bulk-target" value="38" min="1" max="500">
          </label>
          <div class="small muted">Processing stops automatically once the target verified cap is reached. Deduplication is performed across existing prospects.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn ghost" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-submit">Run Bulk Enrichment</button>
      </div>
    </div>
  `);

  $("#modal-close").onclick = closeModal;
  $("#modal-cancel").onclick = closeModal;

  const fileInput = $("#bulk-file");
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        $("#bulk-text").value = evt.target.result;
      };
      reader.readAsText(file);
    }
  };

  $("#modal-submit").onclick = async () => {
    const rawText = $("#bulk-text").value.trim();
    if (!rawText) return toast("Please select a CSV file or paste CSV content.");
    const parsed = parseCSVClient(rawText);
    if (!parsed.length) return toast("No valid prospect rows found. Check column headers.");
    const target = parseInt($("#bulk-target").value, 10) || 38;

    const submitBtn = $("#modal-submit");
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="icon-btn spinning" style="display:inline-block;padding:0;height:auto;">↻</span> Processing ${parsed.length} prospects...`;

    try {
      let queued = 0;
      for (let i = 0; i < parsed.length; i += 200) {   // the server takes 200 rows per request
        const res = await api("prospects/bulk-enrich", { prospects: parsed.slice(i, i + 200), max_verified_target: target });
        queued += res.count || 0;
      }
      closeModal();
      toast(`Queued ${queued} prospects. They're searched in the background on your Mac; results appear here as they finish (see Activity).`);
      renderProspects($("#panel"));
    } catch (e) {
      toast("Bulk import failed: " + (e.message || "Unknown error"));
      submitBtn.disabled = false;
      submitBtn.textContent = "Run Bulk Enrichment";
    }
  };
}

function showEvidenceModal(p) {
  let evList = [];
  try {
    evList = typeof p.provenance === "string" ? JSON.parse(p.provenance || "[]") : (p.provenance || []);
  } catch (err) {}

  const name = p.full_name || [p.first_name, p.last_name].filter(Boolean).join(" ") || "Unknown";
  const conf = p.confidence_score != null ? p.confidence_score : 0;

  showModal(`
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title">Evidence & Provenance: ${esc(name)}</h3>
        <button class="btn ghost icon-btn" id="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border);">
          <div style="font-size:16px; font-weight:600;">${esc(p.final_email || "No email resolved")}</div>
          <div class="small muted" style="margin-top:2px;">
            ${esc(p.company || "")} · ${esc(p.domain || "")} ${p.title ? '· ' + esc(p.title) : ''}
          </div>
          <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
            <span class="badge ${conf >= 90 ? 'verified' : conf >= 75 ? 'high' : conf >= 55 ? 'review' : 'unverified'}">Score: ${conf}% (${esc(p.confidence_level || 'unverified')})</span>
            ${p.email_pattern ? `<span class="badge high">Pattern: ${esc(p.email_pattern)}</span>` : ""}
            ${p.mx_valid ? `<span class="badge verified">✓ Valid MX</span>` : `<span class="badge unverified">Missing MX</span>`}
            ${p.catch_all ? `<span class="badge catchall">Catch-all Domain</span>` : ""}
            ${p.role_email ? `<span class="badge review">Role Address</span>` : ""}
            ${p.verification_provider ? `<span class="badge high">Provider: ${esc(p.verification_provider)}</span>` : ""}
          </div>
        </div>

        <h4 style="margin:12px 0 8px; font-size:14px; font-weight:600;">Audit Trail & Scoring Signals</h4>
        ${evList && evList.length ? `
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${evList.map((e) => {
              const w = e.weight != null ? e.weight : 0;
              const wCls = w > 0 ? "good-ink" : w < 0 ? "critical-ink" : "muted";
              const wPrefix = w > 0 ? "+" : "";
              return `<div style="background:var(--surface-2); border-radius:8px; padding:10px 12px; font-size:13.5px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <strong style="text-transform:capitalize;">${esc(String(e.type || "").replace(/_/g, " "))}</strong>
                  <span class="num font-bold" style="color:var(--${wCls});">${wPrefix}${w}</span>
                </div>
                <div class="small muted" style="margin-top:3px;">${esc(e.detail || "")}</div>
                ${(e.url || e.source_url) ? `<div style="margin-top:4px;"><a href="${esc(safeUrl(e.url || e.source_url))}" target="_blank" rel="noopener noreferrer" class="small muted">Source: ${esc(e.url || e.source_url)} ↗</a></div>` : ""}
              </div>`;
            }).join("")}
          </div>
        ` : `<div class="small muted">No granular evidence records stored for this prospect.</div>`}
      </div>
      <div class="modal-footer">
        <button class="btn primary" id="modal-close-btn">Close</button>
      </div>
    </div>
  `);

  $("#modal-close").onclick = closeModal;
  $("#modal-close-btn").onclick = closeModal;
}

async function reEnrichProspect(p, btn) {
  btn.disabled = true;
  btn.classList.add("spinning");
  try {
    const res = await api("prospects/enrich", {
      first_name: p.first_name,
      last_name: p.last_name,
      company: p.company,
      domain: p.domain,
      title: p.title,
      linkedin_url: p.linkedin_url
    });
    toast(res.queued ? "Queued: your Mac re-checks this in the next minute or two." : `Re-enriched: ${res.final_email || 'No email'} (${res.confidence_score}%)`);
    renderProspects($("#panel"));
  } catch (e) {
    toast("Re-enrichment failed: " + e.message);
    btn.disabled = false;
    btn.classList.remove("spinning");
  }
}

/* ------------------------------------------------------------------ activity */
function renderQueue(panel) {
  const pending = (state.data.actions || []).filter((a) => a.status === "pending");
  const jobs = (state.data.engine || {}).jobs || {};
  const running = Object.entries(jobs).filter(([, j]) => j.running);
  panel.innerHTML = `<h2 class="section">Waiting for your Mac <span class="count num">${pending.length}</span></h2>
    <p class="small muted">Dashboard actions are picked up within a minute while your Mac is awake and the dashboard service is running.</p>
    ${pending.length ? `<div class="table-wrap"><table><thead><tr><th>Queued</th><th>Task</th><th>Item</th></tr></thead><tbody>${pending.map((a) =>
      `<tr><td>${esc(ago(a.created_at))}</td><td>${esc(({ run_prepare: "Find & draft new leads", run_community: "Check community boards", run_content: "Draft LinkedIn posts", run_all: "Run all three" })[a.kind] || a.kind.replaceAll("_", " "))}</td><td>${a.target === 1 ? "—" : "#" + esc(a.target)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><strong>No dashboard actions waiting</strong>New actions appear here until your Mac applies them.</div>`}
    <h2 class="section">Running now <span class="count num">${running.length}</span></h2>
    ${running.length ? running.map(([name, j]) => `<article class="card"><strong>${esc((JOB_INFO[name] || [name])[0])}</strong><div class="small muted">Started ${esc(ago(j.started))}</div></article>`).join("")
      : `<div class="empty"><strong>No background jobs running</strong>Scheduled jobs start at their next due time.</div>`}
    <h2 class="section">Scheduled work · ${esc((state.data.engine || {}).home_timezone || "Asia/Kolkata")}</h2>
    <div class="table-wrap"><table><thead><tr><th>Task</th><th>Schedule</th></tr></thead><tbody>
      <tr><td>Engine, sending and dashboard sync</td><td>Every 5 minutes</td></tr>
      <tr><td>Inbox replies</td><td>Every 10 minutes</td></tr>
      <tr><td>Community boards</td><td>Every 30 minutes</td></tr>
      <tr><td>Find & draft new leads</td><td>07:30, Monday–Saturday</td></tr>
      <tr><td>LinkedIn post drafts</td><td>08:00 Monday</td></tr>
      <tr><td>Weekly digest</td><td>09:00 Monday</td></tr>
      <tr><td>Ad Library and LinkedIn tasks</td><td>09:45 daily</td></tr>
    </tbody></table></div><p class="small muted">Scheduled times use the home time zone in settings.yaml. A missed run starts at the first engine tick after your Mac wakes.</p>`;
}

function renderActivity(panel) {
  const acts = state.data.actions || [];
  const label = { approve: "Approve", reject: "Reject", regenerate: "Regenerate", reply_send: "Send reply", reply_done: "Reply done", post_done: "Post answered",
    run_prepare: "Find & draft", run_community: "Check boards", pause_sending: "Pause sending", resume_sending: "Resume sending", add_lead: "Add company",
    set_stage: "Deal stage", make_plan: "Make plan", run_content: "Draft posts", sync: "Sync now",
    find_prospects: "Find emails", promote_prospect: "Send to engine", send_anyway: "Send anyway", mark_sent: "Marked sent", retry_send: "Retry send",
    approve_many: "Approve all", run_all: "Run all three", draft_lead: "Draft email" };
  const finished = acts.filter((a) => a.status !== "pending").length;
  panel.innerHTML = (acts.length ? `<div class="toolbar"><span class="small muted">The last ${acts.length} things you did and what happened. Items still waiting for your Mac are kept when you clear.</span><span class="spacer"></span>
      <button class="btn" id="clear-activity" ${finished ? "" : "disabled"}>Clear activity</button></div>` : "") + (acts.length ? `<div class="table-wrap"><table>
    <thead><tr><th>When</th><th>Action</th><th>Item</th><th>Status</th><th>Result</th></tr></thead>
    <tbody>${acts.map((a) => {
      const cls = a.status === "applied" ? "good" : a.status === "error" ? "critical" : "warning";
      const st = a.status === "pending" ? "Waiting for sync" : a.status === "applied" ? "Applied" : "Error";
      return `<tr><td>${esc(ago(a.created_at))}</td><td>${esc(label[a.kind] || a.kind)}</td><td class="num">${a.kind === "add_lead" || a.target === 1 && FAMILY_OF[a.kind] !== "review" ? "" : "#" + a.target}</td>
        <td><span class="status ${cls}"><span class="dot"></span>${st}</span></td><td style="text-align:left;white-space:normal">${esc(a.result || "")}</td></tr>`;
    }).join("")}</tbody></table></div>`
    : `<div class="empty"><strong>No activity yet</strong>Everything you approve, send or mark done is listed here with its result.</div>`);
  const clear = $("#clear-activity");
  if (clear) clear.onclick = async () => {
    if (!confirm(`Clear ${finished} finished entries from Activity? This only removes the log; nothing is undone.`)) return;
    try { await api("activity/clear", {}); toast("Activity cleared."); await load(true); }
    catch (e) { if (e.message !== "login required") toast("Couldn't clear: " + e.message); }
  };
}

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (state.data && state.tab === "results") render(); }, 200); });

/* ------------------------------------------------------------------ boot */
(async () => {
  try { const me = await api("me"); if (me.authed) await load(); else renderLogin(); }
  catch (e) { renderLogin("Can't reach the dashboard API: " + e.message); }
  setInterval(() => { if (state.data && document.visibilityState === "visible" && !document.querySelector("textarea:focus,input:focus")) load(true); }, 60000);
})();
</script>
