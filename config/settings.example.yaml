# Copy to config/settings.yaml and fill in your inboxes. (settings.yaml is git-ignored.)

sending:
  home_timezone: Asia/Kolkata     # which calendar day the daily caps count against
  min_gap_minutes: 7              # never two sends from one inbox closer than this...
  gap_jitter_minutes: 6           # ...plus a random 0-6 min, so the rhythm looks human
  max_bounce_rate: 0.03           # an inbox pauses itself above 3% bounces over 7 days
  # Max cold sends (first emails + follow-ups) per inbox per day, by week since warmup_start.
  # Week 0 is warm-up only. Keep the warm-up tool running the whole month.
  ramp_by_week: [0, 12, 25, 35]

sequence:
  followup_days: [3, 7, 14]       # days after email 1; all follow-ups thread under it

