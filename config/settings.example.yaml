# Copy to config/settings.yaml (git-ignored) and fill in your inboxes.

targeting:
  india_share_max: 0.33       # at most a third of each day's new emails go to India-market segments
  min_fit: 6                  # research fit score (0-10) needed before a lead is drafted

sending:
  home_timezone: Asia/Kolkata
  min_gap_minutes: 8          # never two sends from one inbox closer than this...
  gap_jitter_minutes: 7       # ...plus a random 0-7 min
  max_bounce_rate: 0.03       # an inbox pauses itself above 3% bounces over 7 days
  # Cold sends (first emails + follow-ups) per inbox per day, by week since warmup_start.
  ramp_by_week: [10, 20, 30, 35]

sequence:
  # Two follow-ups, not three: on free inboxes, send capacity is the bottleneck.
  followup_days: [4, 10]

# One free Zoho Mail inbox sends both freelance and internship emails.
# Zoho's free plan has no SMTP/IMAP, so it sends through Zoho's REST API: run
# `python -m outreach zoho-check --send-test yourgmail@gmail.com` before the first real send.
# A brand-new address: the ramp (10 -> 20 -> 30 -> 35/day, follow-ups included) is its warm-up.
inboxes:
  - email: workwithavnish@zohomail.in
    display_name: Avnish Rana
    transport: zoho_api          # use "smtp" + smtp.zoho.in/imap.zoho.in only on a paid plan
    zoho_dc: in                  # zohomail.in accounts live in Zoho's India data centre
    client_id_env: ZOHO_CLIENT_ID
    client_secret_env: ZOHO_CLIENT_SECRET
    refresh_token_env: ZOHO_REFRESH_TOKEN
    max_per_day: 35
    warmup_start: 2026-10-01     # set to the day you actually start sending

  # Optional second inbox, off: it would double capacity, but you chose one address for everything.
  - email: avnishrana797@gmail.com
    display_name: Avnish Rana
    transport: smtp
    password_env: GMAIL_APP_PASSWORD
    smtp_host: smtp.gmail.com
    smtp_port: 465
    imap_host: imap.gmail.com
    drafts_folder: "[Gmail]/Drafts"
    max_per_day: 35
    warmup_start: 2026-10-01
    enabled: false

# Firecrawl: fallback for sites a plain download can't read, for finding contact/team pages,
# and for looking up a company's website by name. Every call counts against the daily cap;
# at the cap (or with no credits left) the engine carries on without it.
firecrawl:
  enabled: true
  use_for: [scrape, map, search]
  daily_credit_cap: 60           # raise if you're on a paid plan or self-hosting

# Segments. daily_new sums to 38; India-market segments = 12 (32%), under india_share_max. With one inbox (35 sends/day including
# follow-ups) the sender reaches ~35 new/day in week 1 and ~15-20 new/day once follow-ups start.
segments:
  gulf_realestate:
    daily_new: 8
    market: gulf
    country: UAE
    timezone: Asia/Dubai
    send_days: [1, 2, 3, 4, 5]
    send_windows: ["09:30-12:30", "14:00-17:30"]
    signature: freelance
    audience: >
      Owners and managing directors of small and mid-size real-estate brokerages in Dubai, Abu Dhabi,
      Sharjah and Riyadh (5-60 agents) that list on Bayut, Property Finder and Dubizzle.
    pain: >
      Portal leads cost a lot and are answered slowly; agents handle WhatsApp on personal phones; the
      owner can't see which portal or campaign produces deals, or which agent dropped a lead.
    offer: >
      "WhatsApp Lead Engine" pilot: every portal, website and ad lead gets an instant WhatsApp reply,
      is assigned to an agent with a call-within-30-minutes reminder, and is tagged with its source,
      so the owner sees cost per deal by portal. Fixed USD 350 (about AED 1,300), live in 7 working
      days on their existing number and tools; they pay only once it's running.
    price: "USD 350 fixed (about AED 1,300), live in 7 working days, paid on go-live"
    cta: "Ask if they'd like a one-page plan for their brokerage, free, no call needed."
    angles:
      - id: speed
        focus: "Speed to first reply: portal and ad leads that wait hours go to the next agency; lead with response time."
      - id: attribution
        focus: "Knowing which portal or ad produces deals: lead with spend that can't be traced to closed deals."
    tone: "Professional, concise, respectful."
    market_style: >
      Polite, slightly formal international English. Prices in AED or USD. Their week runs Monday to
      Friday. Never assume nationality or religion.
    score_signals: {whatsapp_link: 10, portals: 15, no_crm: 15, no_whatsapp_tool: 10, form_tool: 5}

  uk_agencies:
    daily_new: 5
    market: uk
    country: United Kingdom
    timezone: Europe/London
    send_days: [2, 3, 4]
    send_windows: ["09:00-11:30", "13:30-16:00"]
    signature: freelance
    audience: >
      Owners of small UK marketing, web and CRM agencies (2-30 people) that sell to SMBs.
    pain: >
      Clients ask for WhatsApp/SMS follow-ups, CRM routing and AI features; UK developers cost
      £50-90/hr, which kills the margin on small projects, so the agency says no or loses money.
    offer: >
      White-label automation partner: the first client task (a CRM integration, WhatsApp/SMS follow-up
      flow, lead routing or an AI feature) as a fixed-price trial from GBP 200, written spec within 24
      hours, delivered in about a week, working UK mornings. Then per-task quotes or a small monthly
      retainer.
    price: "first task fixed from GBP 200, spec in 24 hours, delivered in about a week"
    cta: "Ask if there's one small automation task in their backlog they'd trust to a fixed-price trial."
    angles:
      - id: margin
        focus: "Margin: small automation jobs are unprofitable at UK developer rates; white-label keeps them profitable."
      - id: capacity
        focus: "Capacity: say yes to the automation and AI requests clients already make, without hiring."
    tone: "Understated partner-to-partner, no hype."
    market_style: British spelling, understated, no exclamation marks, money in GBP or USD.
    score_signals: {careers: 10, analytics: 5, cms_wordpress: 5}

  us_agencies:
    daily_new: 3
    market: us
    country: United States
    timezone: America/New_York
    send_days: [2, 3, 4]
    send_windows: ["08:00-12:30"]            # = 17:30-22:00 IST, the top of their morning inbox
    signature: freelance_us
    audience: Owners of small US marketing, web and automation agencies (2-30 people).
    pain: >
      Automation and AI work is in demand, but US contractors at $75-150/hr make small client
      projects unprofitable.
    offer: >
      White-label automation and AI developer: the first client task as a fixed-price trial from
      USD 250, spec within 24 hours, delivered in about a week, overlapping the US morning with daily
      async updates. Then per-task quotes or a small retainer.
    price: "first task fixed from USD 250, spec in 24 hours, delivered in about a week"
    cta: "Ask if they have one automation task they'd trust to a small fixed-price trial."
    angles:
      - id: margin
        focus: "Margin: US contractor rates make small automation projects unprofitable; fixed-price white-label fixes that."
      - id: speed
        focus: "Turnaround: a written spec in 24 hours and a working version within a week, so client requests don't stall."
    tone: "Direct, concise, value-first."
    market_style: American spelling, direct, money in USD.
    score_signals: {careers: 10, analytics: 5}

  intl_freelance_posts:
    daily_new: 5
    market: global
    country: ""
    timezone: America/New_York
    send_days: [1, 2, 3, 4, 5]
    send_windows: ["08:00-12:30"]
    signature: freelance_us
    audience: >
      People and small companies who publicly posted that they need this work done now: Hacker News
      "Seeking freelancer" posts, and contract / part-time automation, AI or integration roles on
      remote job boards (the SOURCE text is their post).
    pain: They have a defined project or role and need someone reliable now.
    offer: >
      Deliver the posted project at a fixed price (quoted after reading their spec, usually USD 150-600
      for a first milestone), with a written plan within 24 hours and a working demo in the first week.
    price: "fixed price per milestone, quoted from their spec; plan in 24 hours, demo within a week"
    angles:
      - id: plan
        focus: "Lead with how he'd build exactly what they posted, step by step, in two sentences."
      - id: proof
        focus: "Lead with the closest thing he has already shipped to what they posted."
    cta: "Ask if they'd like a short written plan and a fixed quote for their project."
    tone: "Direct, specific to their post, businesslike."
    market_style: International English, match the post's tone, money in USD.
    score_signals: {}

  intl_startups_intern:
    daily_new: 5                             # cut from 8: hiring abroad from India is often blocked by payroll/visa
    market: global
    country: ""
    timezone: America/New_York
    send_days: [1, 2, 3, 4, 5]
    send_windows: ["08:00-12:30"]            # US Eastern morning = IST evening
    signature: internship
    audience: >
      Founders and CTOs of seed-to-Series-A AI and SaaS startups in the US, UK, Singapore, UAE and
      remote-first teams (2-60 people) that are hiring, especially ones with an India team or a
      "remote (global)" policy.
    pain: >
      They need people who can ship end to end (spec, code, production, metrics) without
      hand-holding, and most applicants can't show that.
    offer: >
      A paid two-week trial project (remote, contract basis, so no visa or payroll setup) on one
      concrete problem from their product, with the option to continue as a product/AI-engineering
      intern or contractor. Include one specific idea for their product in the email.
    price: "paid two-week trial project, contract basis, then optionally an internship or contract"
    angles:
      - id: idea
        focus: "Open with one specific, buildable idea for their product, then the trial project."
      - id: shipped
        focus: "Open with what he has shipped end to end in production, then the trial project."
    cta: "Ask if they're open to a 15-minute chat, or if someone else on the team is better to talk to."
    tone: "Confident, specific, respectful of their time."
    market_style: International English, founder-to-builder, no flattery.
    score_signals: {careers: 20, ai_mention: 10, framework_next: 5}

  india_realestate:
    daily_new: 6
    market: india
    country: India
    timezone: Asia/Kolkata
    send_days: [1, 2, 3, 4, 5, 6]
    send_windows: ["10:30-13:00", "15:00-18:30"]
    signature: freelance
    audience: >
      Owners of Indian real-estate brokerages, channel partners and small developers (3-40 person
      sales teams) that buy leads from 99acres, MagicBricks, Housing and Facebook ads.
    pain: >
      Portal and ad leads are answered hours late or never; leads live in Excel and personal
      WhatsApp; no one knows which source produced a deal.
    offer: >
      "WhatsApp Lead Engine" pilot: every 99acres, MagicBricks, Housing and Facebook lead goes into one
      place, gets an instant WhatsApp reply, is auto-assigned with a call-in-30-minutes reminder and is
      tied to its source. Fixed Rs 25,000, live in 7 working days, paid on go-live.
    price: "Rs 25,000 fixed, live in 7 working days, paid on go-live"
    angles:
      - id: speed
        focus: "Speed: portal leads answered hours late go to the next broker; lead with response time."
      - id: leakage
        focus: "Leakage: leads living in Excel and personal WhatsApp get lost when an agent leaves or forgets."
    cta: "Ask if they'd like a 1-page plan for their team, free, no call needed."
    tone: "Direct and practical, owner to operator."
    market_style: Indian English is fine; money in rupees.
    score_signals: {whatsapp_link: 10, portals: 15, no_crm: 15, no_whatsapp_tool: 10}

  india_startups_intern:
    daily_new: 6                             # raised from 3: Indian startups can hire you without visa friction
    market: india
    country: India
    timezone: Asia/Kolkata
    send_days: [1, 2, 3, 4, 5]
    send_windows: ["09:30-12:00", "14:00-17:30"]
    signature: internship
    audience: Founders/CTOs of funded Indian AI and SaaS startups that are hiring.
    pain: They need interns who ship to production from week one.
    offer: >
      A product/AI-engineering internship that starts with a paid one-week trial task on a real problem
      from their product, with one concrete idea for their product in the email.
    price: "paid one-week trial task, then a stipended internship"
    cta: "Ask if they're open to a 15-minute chat, or would rather send a trial task."
    angles:
      - id: idea
        focus: "Open with one specific, buildable idea for their product."
      - id: shipped
        focus: "Open with the production system he runs for a paying client."
    tone: "Confident, specific."
    market_style: Indian English is fine.
    score_signals: {careers: 20, ai_mention: 10}

# Automated prospecting (run by `prospect` and `prepare`). max_new = leads added per run.
prospecting:
  - source: osm
    segment: gulf_realestate
    country: UAE
    cities: [Dubai, Abu Dhabi, Sharjah, Riyadh]
    tags: ["office=estate_agent", "shop=estate_agent"]
    max_new: 20
  - source: osm
    segment: uk_agencies
    country: United Kingdom
    cities: [London, Manchester, Birmingham, Leeds, Bristol]
    tags: ["office=advertising_agency", "office=marketing"]
    max_new: 12
  - source: osm
    segment: us_agencies
    country: United States
    cities: [New York, Austin, Miami, Chicago]
    tags: ["office=advertising_agency", "office=marketing"]
    max_new: 8
  - source: hn
    thread: freelance
    segment: intl_freelance_posts
    include_any: [automation, whatsapp, crm, ai, llm, react, next.js, python, node, zapier, n8n, scraping, dashboard]
    exclude_any: [senior only, "10+ years", unpaid]
    max_new: 10
  - source: hn
    thread: hiring
    segment: intl_startups_intern
    include_regex: "\\bintern(s|ship|ships)?\\b"
    exclude_any: ["us citizens only", "must be located in the us", "no remote", "onsite only"]
    require_remote: true
    max_new: 15
  - source: yc
    segment: intl_startups_intern
    regions: ["United States of America", "United Kingdom", "Singapore", "United Arab Emirates", "Remote"]
    exclude_regions: []
    max_team: 60
    min_batch_year: 2022
    max_new: 15
  - source: yc
    segment: india_startups_intern
    regions: [India]
    max_team: 80
    min_batch_year: 2020
    max_new: 6
  - source: osm
    segment: india_realestate
    country: India
    cities: [Delhi NCR, Mumbai, Bengaluru, Pune]
    tags: ["office=estate_agent", "shop=estate_agent"]
    max_new: 12

  # --- Remote job boards: one fetch per board per run, shared by both jobs below --------------
  - source: jobs
    segment: intl_freelance_posts        # contract / part-time roles = paid work with a budget
    boards: [remotive, himalayas, remoteok, jobicy, wwr]
    job_types: [contract, freelance, part-time, part time, temporary]
    include_regex: "automation|n8n|zapier|make\\.com|whatsapp|crm|hubspot|llm|\\bai\\b|chatbot|gpt|scrap|integration|python|node|next\\.js|react|dashboard"
    exclude_any: ["us citizens", "security clearance", "must be located in the us", "w2 only", "10+ years", "principal"]
    allowed_locations: [worldwide, anywhere, global, remote, india, asia, apac, emea, middle east, uae]
    max_age_days: 21
    max_new: 8
  - source: jobs
    segment: intl_startups_intern
    boards: [remotive, himalayas, remoteok, jobicy, wwr]
    title_regex: "\\b(intern|internship|junior|graduate|entry[- ]level|trainee|associate engineer)\\b"
    include_regex: "\\bai\\b|llm|machine learning|automation|full[- ]?stack|backend|product engineer|python|typescript"
    exclude_any: ["us citizens", "must be located in the us", "security clearance", "eu only", "europe only"]
    allowed_locations: [worldwide, anywhere, global, remote, india, asia, apac]
    max_age_days: 30
    max_new: 8

  # --- Hacker News "Launch HN": YC startups in their launch week ------------------------------
  - source: launch_hn
    segment: intl_startups_intern
    max_age_days: 120
    max_new: 6

  # --- UK Companies House: small agencies with a named director (free API key in .env) ----------
  # SIC 73110 advertising agencies, 70210 PR, 62012 software development, 74100 design.
  - source: companies_house
    segment: uk_agencies
    locations: [London, Manchester, Birmingham, Leeds, Bristol, Brighton, Glasgow, Edinburgh]
    sic_codes: ["73110", "70210", "62012"]
    incorporated_from: "2012-01-01"
    max_directors: 4                     # more than this is usually not a small agency
    max_new: 10
    max_checks: 60                       # companies looked at per run (each needs a website guess)

  # --- Dubai Land Department register of brokerage offices ------------------------------------
  # Download the offices CSV once (see PLAYBOOK "Dubai broker register") to data/dld_offices.csv.
  # Each run continues from where the last one stopped.
  - source: dld
    segment: gulf_realestate
    csv: data/dld_offices.csv
    tlds: [ae, com]
    max_new: 12
    max_checks: 60
    enabled: false                       # set true once the CSV is in place

  # --- Google Maps via Apify (free $5/month credit ~ 1,000 places). Grey area of Google's terms. --
  - source: apify_maps
    segment: gulf_realestate
    country: UAE
    queries: ["real estate agency", "real estate brokers", "property management company"]
    locations: ["Dubai, United Arab Emirates", "Abu Dhabi, United Arab Emirates", "Sharjah, United Arab Emirates"]
    min_reviews: 5
    max_reviews: 1500
    max_places: 60
    max_new: 20
    enabled: false
  - source: apify_maps
    segment: india_realestate
    country: India
    queries: ["real estate agent", "property dealer", "real estate consultant"]
    locations: ["Noida, India", "Gurugram, India", "Pune, India", "Bengaluru, India", "Mumbai, India"]
    min_reviews: 10
    max_reviews: 1500
    max_places: 60
    max_new: 15
    enabled: false

# Community boards where people post paid "[Hiring]" work. Answered by hand, not by email:
# `python -m outreach community` (cron, every 30 min) -> data/opportunities_today.md + Telegram.
community:
  - name: n8n community jobs
    type: discourse
    url: https://community.n8n.io
    category: jobs
    max_age_hours: 72
  - name: r/forhire
    type: reddit
    subreddit: forhire
    title_regex: "\\[hiring\\]"
    include_regex: "automation|n8n|zapier|make\\.com|whatsapp|crm|llm|\\bai\\b|chatbot|gpt|scrap|integration|python|node|next\\.js|react|dashboard|api"
    exclude_any: ["[for hire]"]
    max_age_hours: 48
  - name: r/n8n hiring
    type: reddit
    subreddit: n8n
    title_regex: "hiring|looking for|need (an? )?(n8n )?(dev|developer|expert|freelancer)|paid"
    max_age_hours: 48
  - name: r/automation hiring
    type: reddit
    subreddit: automation
    title_regex: "hiring|looking for|need (an? )?(dev|developer|expert|freelancer)|paid"
    max_age_hours: 48

# Meta Ad Library (by hand, 15 min/day): `python -m outreach adlib` writes today's searches.
adlibrary:
  countries: [AE, IN, SA]
  keywords: ["real estate", "properties", "apartments for sale", "off plan", "flats", "villas", "property dealer"]

