# Segments: who you email, what you offer them, and how many new leads per day.
# daily_new across all segments = 38. Rebalance at the end of week 2 using `outreach report`.
segments:
  realestate_in:
    daily_new: 12
    country: India
    timezone: Asia/Kolkata
    send_days: [1, 2, 3, 4, 5, 6]            # brokers work Saturdays
    send_windows: ["10:30-13:00", "15:00-18:30"]
    inboxes: [avnish@DOMAIN-ONE.com, rana@DOMAIN-ONE.com, avnish@DOMAIN-TWO.com]
    signature: freelance
    audience: >
      Owners/directors of Indian real-estate brokerages, channel partners and small developers
      (3-40 person sales teams) in NCR, Mumbai, Pune, Bengaluru, Hyderabad who buy leads from
      99acres/MagicBricks/Housing and Facebook ads and work them on WhatsApp.
    pain: >
      Portal and ad leads are answered hours late or never; leads live in Excel and personal
      WhatsApp; no one knows which ad or portal actually produced a deal; agents leave with the leads.
    offer: >
      A 2-week fixed-scope build: every portal/ad/website lead lands in one CRM, gets an instant
      WhatsApp reply with matching properties, is auto-assigned to an agent with a call-in-30-minutes
      reminder, and every deal is tied back to its source. Built on their existing tools where possible.
    cta: "Ask if they'd like a 1-page plan of what this would look like for their team, free, no call needed."
    tone: "Direct and practical, owner to operator. Use rupees and minutes, not jargon."
    score_signals: {whatsapp_link: 10, portals: 15, no_crm: 15, no_whatsapp_tool: 10, form_tool: 5, analytics: 5}

  realestate_uae:
    daily_new: 6
    country: UAE
    timezone: Asia/Dubai
    send_days: [1, 2, 3, 4, 5]
    send_windows: ["09:30-12:30", "14:00-17:00"]
    inboxes: [avnish@DOMAIN-ONE.com, rana@DOMAIN-ONE.com, avnish@DOMAIN-TWO.com]
